name: forge
on:
  workflow_dispatch:
    inputs:
      action:
        description: Forge action
        required: true
        type: choice
        options: [whoami, register, deploy, install, logs]
      site:
        description: Atlassian site for install (e.g. example.atlassian.net)
        required: false
        type: string
      environment:
        description: Forge environment
        required: false
        type: choice
        default: development
        options: [development, production]
permissions:
  contents: write
concurrency:
  group: forge
  cancel-in-progress: false
jobs:
  forge:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_DISABLE_ANALYTICS: "1"
      FORGE_ENV: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        run: npm ci || npm install
      - name: whoami
        if: inputs.action == 'whoami'
        run: npx --yes @forge/cli@15 whoami
      - name: register
        if: inputs.action == 'register'
        # The CLI creates a Developer Space through an interactive name prompt only,
        # so run it under a pseudo-TTY that answers that one prompt.
        run: |
          npm install -g @forge/cli@15 >/dev/null 2>&1
          { sleep 5; printf 'agent-change-gate\r'; sleep 60; } | script -qefc 'forge register --accept-terms "Agent Change Gate"' /dev/null
      - name: commit app id
        if: inputs.action == 'register'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yml
          git diff --cached --quiet || { git commit -m "Register Forge app id" && git push origin HEAD:main; }
      - name: deploy
        if: inputs.action == 'deploy'
        run: |
          # lint exits 1 on "approval" notices (e.g. a scope change means a major version);
          # real errors still fail the deploy below.
          npx --yes @forge/cli@15 lint || echo "lint reported issues (see above)"
          npx --yes @forge/cli@15 deploy -e "$FORGE_ENV" --non-interactive
      - name: install
        if: inputs.action == 'install'
        env:
          SITE: ${{ inputs.site }}
        run: |
          test -n "$SITE" || { echo "site input required"; exit 1; }
          npx --yes @forge/cli@15 install --site "$SITE" --product jira -e "$FORGE_ENV" --non-interactive --confirm-scopes \
            || npx --yes @forge/cli@15 install --site "$SITE" --product jira -e "$FORGE_ENV" --non-interactive --upgrade --confirm-scopes
      - name: logs
        if: inputs.action == 'logs'
        run: npx --yes @forge/cli@15 logs -e "$FORGE_ENV" --since 1h --limit 200
